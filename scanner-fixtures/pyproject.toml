[project]
name = "scanner-fixtures"
version = "0.0.0"
description = "Fixture sources for LLM-call scanner validation (OpenAI, Anthropic, Gemini only)"
readme = false
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "anthropic>=0.40.0",
  "google-generativeai>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
